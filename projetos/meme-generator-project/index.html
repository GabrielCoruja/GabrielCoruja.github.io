<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>O incrível Gerador de Memes</title>
  <meta name="description" content="Envie uma imagem, escreva o texto e baixe seu meme como PNG.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>😂</text></svg>">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topo">
    <a class="voltar" href="../../">← Portfólio</a>
  </header>

  <main class="app">
    <h1>Gerador de Memes</h1>
    <p class="descricao">Selecione uma imagem e escreva o texto para começar a diversão.</p>

    <div class="layout">
      <section class="controles" aria-label="Editar meme">
        <label class="upload" id="area-upload">
          <input type="file" id="meme-insert" accept="image/*">
          <span class="upload__icone" aria-hidden="true">🖼️</span>
          <span><strong>Escolha uma imagem</strong> ou arraste e solte aqui</span>
        </label>

        <p class="rotulo">Ou use um exemplo:</p>
        <div class="exemplos" id="exemplos">
          <button type="button" data-src="exemplos/coruja.svg" aria-label="Exemplo coruja"><img src="exemplos/coruja.svg" alt=""></button>
          <button type="button" data-src="exemplos/cafe.svg" aria-label="Exemplo café"><img src="exemplos/cafe.svg" alt=""></button>
          <button type="button" data-src="exemplos/bug.svg" aria-label="Exemplo bug"><img src="exemplos/bug.svg" alt=""></button>
          <button type="button" data-src="exemplos/gato.svg" aria-label="Exemplo gato"><img src="exemplos/gato.svg" alt=""></button>
        </div>

        <label class="campo">Texto superior
          <input type="text" id="text-input-top" maxlength="60" placeholder="QUANDO O CÓDIGO COMPILA">
        </label>
        <label class="campo">Texto inferior
          <input type="text" id="text-input" maxlength="60" placeholder="DE PRIMEIRA">
        </label>

        <div class="linha">
          <label class="campo campo--meio">Tamanho do texto
            <input type="range" id="tamanho-fonte" min="20" max="80" value="44">
          </label>
          <label class="campo campo--cor">Cor
            <input type="color" id="cor-texto" value="#ffffff">
          </label>
        </div>

        <fieldset class="molduras">
          <legend>Moldura</legend>
          <label><input type="radio" name="moldura" value="nenhuma" checked> Nenhuma</label>
          <label><input type="radio" name="moldura" value="fire"> 🔥 Fogo</label>
          <label><input type="radio" name="moldura" value="water"> 💧 Água</label>
          <label><input type="radio" name="moldura" value="earth"> 🌱 Terra</label>
        </fieldset>

        <div class="linha">
          <button type="button" id="baixar" class="botao">⬇ Baixar meme</button>
          <button type="button" id="limpar" class="botao botao--secundario">Limpar</button>
        </div>
      </section>

      <section class="previa" aria-label="Prévia do meme">
        <div id="meme-image-container" class="moldura">
          <img id="meme-image" src="exemplos/coruja.svg" alt="Imagem do meme">
          <p id="meme-text-top" class="texto-meme texto-meme--topo"></p>
          <p id="meme-text" class="texto-meme texto-meme--base"></p>
        </div>
      </section>
    </div>
  </main>

  <script src="scripts.js"></script>
</body>
</html>
